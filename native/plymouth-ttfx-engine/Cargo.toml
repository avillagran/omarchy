[package]
name = "ttfx-plymouth"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
clap = "4"
# The embedded adapter uses Effect::next_frame, not the terminal-owning ASM runner.
# Keep the Rust backend explicit until ASM exposes a bounded structured step API.
ttfx = { path = "vendor/ttfx", default-features = false }

[profile.plymouth]
inherits = "release"
panic = "unwind"
strip = false
